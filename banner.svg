<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="shelf-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5C4008"/>
    </linearGradient>
    <linearGradient id="shelf-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8960C"/>
      <stop offset="100%" stop-color="#9A7010"/>
    </linearGradient>
    <linearGradient id="apple-r" x1="0.3" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="apple-shine" x1="0.2" y1="0" x2="0.6" y2="0.5">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="banana-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9E04B"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="milk-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#C8DCF0"/>
    </linearGradient>
    <linearGradient id="milk-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B0CCE4"/>
      <stop offset="100%" stop-color="#8aaec8"/>
    </linearGradient>
    <linearGradient id="rice-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E0"/>
      <stop offset="100%" stop-color="#D4C89A"/>
    </linearGradient>
    <linearGradient id="rice-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8BC8A"/>
      <stop offset="100%" stop-color="#A89A6A"/>
    </linearGradient>
    <linearGradient id="can-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#9B2820"/>
    </linearGradient>
    <linearGradient id="can-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#7B1818"/>
    </linearGradient>
    <linearGradient id="oil-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="oil-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7DC6F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4A800" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sugar-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#D0C8C0"/>
    </linearGradient>
    <linearGradient id="sugar-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8C0B8"/>
      <stop offset="100%" stop-color="#A89890"/>
    </linearGradient>
    <linearGradient id="floor-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#141e2a"/>
    </linearGradient>
    <linearGradient id="title-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C73E6"/>
      <stop offset="50%" stop-color="#A89EEC"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#7C73E6" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- ═══ SHELF UNIT (isometric-style) ═══ -->
  <!-- Back panel -->
  <rect x="60" y="70" width="520" height="280" rx="4" fill="#0D1117" opacity="0.7"/>
  <!-- Shelf 1 top surface -->
  <ellipse cx="320" cy="180" rx="263" ry="12" fill="url(#shelf-top)" opacity="0.95"/>
  <rect x="60" y="180" width="520" height="16" fill="url(#shelf-g)"/>
  <!-- Shelf 2 top surface -->
  <ellipse cx="320" cy="290" rx="263" ry="12" fill="url(#shelf-top)" opacity="0.95"/>
  <rect x="60" y="290" width="520" height="16" fill="url(#shelf-g)"/>
  <!-- Floor surface hint -->
  <rect x="60" y="330" width="520" height="20" rx="2" fill="#5C4008" opacity="0.5"/>

  <!-- ═══ 3D ITEMS — SHELF 1 (top) ═══ -->

  <!-- APPLE (red, 3D sphere illusion) -->
  <g filter="url(#shadow)">
    <ellipse cx="120" cy="172" rx="38" ry="36" fill="url(#apple-r)"/>
    <ellipse cx="105" cy="155" rx="16" ry="12" fill="url(#apple-shine)" opacity="0.7"/>
    <!-- Stem -->
    <path d="M120,137 Q125,128 130,122" stroke="#3D2B0A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M125,128 Q140,118 135,130 Q128,133 125,128Z" fill="#2D8A3E" opacity="0.9"/>
    <!-- Apple bottom dimple -->
    <ellipse cx="120" cy="205" rx="6" ry="3" fill="#9B2820" opacity="0.4"/>
  </g>

  <!-- BANANA BUNCH -->
  <g filter="url(#shadow)" transform="translate(195,130)">
    <path d="M0,45 Q-8,15 10,0 Q28,-8 40,10 Q50,28 30,50Z" fill="url(#banana-g)"/>
    <path d="M8,47 Q0,18 18,3 Q35,-5 46,12 Q55,30 37,52Z" fill="#F5CB30" opacity="0.7"/>
    <path d="M18,48 Q12,22 28,8 Q44,0 52,18 Q58,34 43,52Z" fill="#E8B800" opacity="0.5"/>
    <!-- banana tip dots -->
    <ellipse cx="10" cy="0" rx="4" ry="3" fill="#8B6914" opacity="0.8" transform="rotate(-15)"/>
    <!-- shine -->
    <path d="M5,38 Q0,22 12,10" stroke="#FFF8A0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- MILK CARTON (isometric box) -->
  <g filter="url(#shadow)" transform="translate(278,105)">
    <!-- front face -->
    <rect x="0" y="30" width="52" height="70" fill="url(#milk-g)" rx="2"/>
    <!-- right face (darker) -->
    <polygon points="52,30 72,20 72,88 52,100" fill="url(#milk-side)"/>
    <!-- top face -->
    <polygon points="0,30 20,20 72,20 52,30" fill="#FFFFFF" opacity="0.95"/>
    <!-- roof peak -->
    <polygon points="0,30 26,0 52,30" fill="#E8F4FF" opacity="0.9"/>
    <polygon points="52,30 72,20 46,-10 26,0" fill="#C0D8F0" opacity="0.85"/>
    <!-- MILK label text hint -->
    <rect x="8" y="50" width="36" height="30" rx="3" fill="#3B8BD4" opacity="0.25"/>
    <rect x="12" y="56" width="28" height="4" rx="2" fill="#3B8BD4" opacity="0.5"/>
    <rect x="14" y="64" width="22" height="3" rx="1" fill="#3B8BD4" opacity="0.4"/>
    <!-- shine -->
    <polygon points="4,32 20,22 20,60 4,70" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- RICE BAG (flat isometric package) -->
  <g filter="url(#shadow)" transform="translate(370,115)">
    <!-- front -->
    <rect x="0" y="20" width="58" height="65" rx="6" fill="url(#rice-g)"/>
    <!-- right side -->
    <polygon points="58,20 80,10 80,73 58,85" fill="url(#rice-side)"/>
    <!-- top -->
    <polygon points="0,20 22,10 80,10 58,20" fill="#F8F2DE" opacity="0.95"/>
    <!-- design elements on bag -->
    <ellipse cx="29" cy="52" rx="18" ry="18" fill="#FFFFFF" opacity="0.3"/>
    <rect x="10" y="68" width="38" height="5" rx="2" fill="#A89A6A" opacity="0.5"/>
    <!-- rice grains scattered inside circle -->
    <g fill="#888060" opacity="0.6">
      <ellipse cx="22" cy="48" rx="3" ry="1.5" transform="rotate(-30,22,48)"/>
      <ellipse cx="30" cy="44" rx="3" ry="1.5" transform="rotate(15,30,44)"/>
      <ellipse cx="38" cy="50" rx="3" ry="1.5" transform="rotate(-20,38,50)"/>
      <ellipse cx="26" cy="56" rx="3" ry="1.5" transform="rotate(40,26,56)"/>
      <ellipse cx="34" cy="56" rx="3" ry="1.5" transform="rotate(-10,34,56)"/>
    </g>
    <!-- shine -->
    <polygon points="4,22 22,12 22,50 4,60" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- ═══ 3D ITEMS — SHELF 2 (bottom) ═══ -->

  <!-- TOMATO CAN (cylinder) -->
  <g filter="url(#shadow)" transform="translate(88,230)">
    <!-- cylinder body -->
    <rect x="0" y="10" width="56" height="62" fill="url(#can-g)"/>
    <!-- right dark side -->
    <rect x="48" y="10" width="12" height="62" fill="url(#can-side)" opacity="0.7"/>
    <!-- top ellipse -->
    <ellipse cx="28" cy="10" rx="28" ry="10" fill="#FF6B6B"/>
    <!-- top rim -->
    <ellipse cx="28" cy="10" rx="28" ry="10" fill="none" stroke="#C0392B" stroke-width="2"/>
    <!-- bottom ellipse -->
    <ellipse cx="28" cy="72" rx="28" ry="10" fill="#9B2820"/>
    <!-- label white band -->
    <rect x="0" y="26" width="56" height="32" fill="#FFFFFF" opacity="0.15"/>
    <rect x="4" y="32" width="42" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
    <rect x="6" y="40" width="34" height="3" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="8" y="47" width="26" height="3" rx="1" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- OIL BOTTLE (glass, transparent-ish) -->
  <g filter="url(#shadow)" transform="translate(188,205)">
    <!-- bottle body -->
    <rect x="8" y="40" width="40" height="80" rx="8" fill="#C8A800" opacity="0.3"/>
    <!-- liquid inside -->
    <rect x="10" y="44" width="36" height="72" rx="6" fill="url(#oil-liquid)"/>
    <!-- bottle neck -->
    <rect x="18" y="16" width="20" height="28" rx="4" fill="#C8A800" opacity="0.35"/>
    <rect x="20" y="18" width="16" height="24" rx="3" fill="url(#oil-liquid)" opacity="0.7"/>
    <!-- cap -->
    <rect x="16" y="8" width="24" height="12" rx="4" fill="#888030"/>
    <ellipse cx="28" cy="8" rx="12" ry="5" fill="#A0A040"/>
    <!-- bottle outline -->
    <rect x="8" y="40" width="40" height="80" rx="8" fill="none" stroke="#A08010" stroke-width="1.5"/>
    <rect x="18" y="16" width="20" height="28" rx="4" fill="none" stroke="#A08010" stroke-width="1.2"/>
    <!-- shine (glass effect) -->
    <rect x="12" y="46" width="10" height="40" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <rect x="22" y="20" width="4" height="14" rx="2" fill="#FFFFFF" opacity="0.25"/>
    <!-- label -->
    <rect x="10" y="62" width="36" height="32" rx="4" fill="#FFFFFF" opacity="0.15"/>
    <rect x="13" y="68" width="26" height="3" rx="1" fill="#B8860B" opacity="0.6"/>
    <rect x="15" y="76" width="20" height="2" rx="1" fill="#B8860B" opacity="0.4"/>
  </g>

  <!-- SUGAR PACKET (small box) -->
  <g filter="url(#shadow)" transform="translate(280,250)">
    <!-- front -->
    <rect x="0" y="10" width="50" height="52" rx="4" fill="url(#sugar-g)"/>
    <!-- right -->
    <polygon points="50,10 68,2 68,50 50,62" fill="url(#sugar-side)"/>
    <!-- top -->
    <polygon points="0,10 18,2 68,2 50,10" fill="#FFFFFF" opacity="0.9"/>
    <!-- decoration -->
    <rect x="5" y="22" width="40" height="28" rx="3" fill="#E8E0D8" opacity="0.5"/>
    <rect x="8" y="28" width="34" height="4" rx="2" fill="#7C73E6" opacity="0.4"/>
    <rect x="10" y="36" width="26" height="3" rx="1" fill="#7C73E6" opacity="0.3"/>
    <rect x="12" y="43" width="20" height="2" rx="1" fill="#7C73E6" opacity="0.2"/>
    <polygon points="4,12 18,4 18,35 4,43" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- SPICE JAR (small round jar) -->
  <g filter="url(#shadow)" transform="translate(368,240)">
    <rect x="4" y="20" width="46" height="50" rx="10" fill="#8B3A3A"/>
    <rect x="6" y="22" width="42" height="46" rx="8" fill="#A84040" opacity="0.7"/>
    <!-- lid -->
    <rect x="0" y="10" width="54" height="16" rx="6" fill="#5A2020"/>
    <ellipse cx="27" cy="10" rx="27" ry="8" fill="#6A2828"/>
    <!-- label -->
    <rect x="8" y="32" width="38" height="24" rx="4" fill="#FFEECC" opacity="0.25"/>
    <rect x="10" y="38" width="30" height="3" rx="1" fill="#FFEECC" opacity="0.5"/>
    <rect x="12" y="46" width="24" height="2" rx="1" fill="#FFEECC" opacity="0.35"/>
    <!-- shine -->
    <rect x="6" y="22" width="10" height="28" rx="4" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- ═══ TEXT SECTION ═══ -->
  <!-- Title -->
  <text x="650" y="120" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="url(#title-g)" filter="url(#glow)">Grocery</text>
  <text x="650" y="178" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="url(#title-g)" filter="url(#glow)">Management</text>
  <text x="650" y="236" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="url(#title-g)" filter="url(#glow)">System</text>

  <!-- Subtitle divider line -->
  <rect x="650" y="252" width="200" height="2" rx="1" fill="url(#title-g)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="650" y="282" font-family="Arial, sans-serif" font-size="18" fill="#9A9ECC" letter-spacing="1">C++ | OOP | File Handling</text>

  <!-- Badges -->
  <!-- Badge 1 -->
  <rect x="650" y="306" width="110" height="28" rx="14" fill="#7C73E6" opacity="0.2"/>
  <rect x="650" y="306" width="110" height="28" rx="14" fill="none" stroke="#7C73E6" stroke-width="1" opacity="0.6"/>
  <text x="705" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#A89EEC">Shopkeeper</text>

  <!-- Badge 2 -->
  <rect x="774" y="306" width="90" height="28" rx="14" fill="#1D9E75" opacity="0.2"/>
  <rect x="774" y="306" width="90" height="28" rx="14" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.6"/>
  <text x="819" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5DCAA5">Customer</text>

  <!-- Badge 3 -->
  <rect x="878" y="306" width="80" height="28" rx="14" fill="#D85A30" opacity="0.2"/>
  <rect x="878" y="306" width="80" height="28" rx="14" fill="none" stroke="#D85A30" stroke-width="1" opacity="0.6"/>
  <text x="918" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#F0997B">Billing</text>

  <!-- Bottom tagline -->
  <text x="650" y="365" font-family="Arial, sans-serif" font-size="14" fill="#5A6080" letter-spacing="0.5">Console-based   •   Menu-driven   •   Data Persistent</text>

  <!-- Corner decoration dots -->
  <circle cx="40" cy="40" r="3" fill="#7C73E6" opacity="0.4"/>
  <circle cx="55" cy="40" r="2" fill="#7C73E6" opacity="0.25"/>
  <circle cx="40" cy="55" r="2" fill="#7C73E6" opacity="0.25"/>
  <circle cx="1160" cy="360" r="3" fill="#1D9E75" opacity="0.4"/>
  <circle cx="1145" cy="360" r="2" fill="#1D9E75" opacity="0.25"/>
  <circle cx="1160" cy="345" r="2" fill="#1D9E75" opacity="0.25"/>
</svg>
