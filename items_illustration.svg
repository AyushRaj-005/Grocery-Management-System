<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12172A"/>
      <stop offset="100%" stop-color="#1A2340"/>
    </linearGradient>
    <linearGradient id="ar" x1="0.3" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="ash" x1="0.2" y1="0" x2="0.6" y2="0.5">
      <stop offset="0%" stop-color="#FFB3B3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#C8DCF0"/>
    </linearGradient>
    <linearGradient id="ms" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B0CCE4"/>
      <stop offset="100%" stop-color="#8aaec8"/>
    </linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9E04B"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7A832"/>
      <stop offset="100%" stop-color="#C06800"/>
    </linearGradient>
    <linearGradient id="osh" x1="0.2" y1="0" x2="0.7" y2="0.5">
      <stop offset="0%" stop-color="#FFCC80" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F7A832" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#9B2820"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E0"/>
      <stop offset="100%" stop-color="#D4C89A"/>
    </linearGradient>
    <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8BC8A"/>
      <stop offset="100%" stop-color="#A89A6A"/>
    </linearGradient>
    <linearGradient id="olg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7DC6F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D4A800" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#145A32"/>
    </linearGradient>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg2)" rx="12"/>
  <!-- subtle shelf line -->
  <rect x="30" y="155" width="840" height="6" rx="3" fill="#3A3020" opacity="0.7"/>
  <ellipse cx="450" cy="158" rx="423" ry="6" fill="#6A5418" opacity="0.4"/>

  <!-- ── APPLE ── -->
  <g filter="url(#ds)">
    <ellipse cx="90" cy="138" rx="42" ry="40" fill="url(#ar)"/>
    <ellipse cx="74" cy="118" rx="18" ry="14" fill="url(#ash)" opacity="0.75"/>
    <path d="M90,99 Q96,89 103,83" stroke="#3D2B0A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M97,88 Q114,76 109,90 Q101,95 97,88Z" fill="#2D8A3E"/>
  </g>
  <text x="90" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Apple</text>

  <!-- ── BANANA ── -->
  <g filter="url(#ds)" transform="translate(162,90)">
    <path d="M0,55 Q-10,18 12,0 Q32,-10 46,12 Q56,32 32,60Z" fill="url(#bg3)"/>
    <path d="M9,58 Q0,22 20,5 Q40,-6 52,16 Q60,35 40,63Z" fill="#F5CB30" opacity="0.65"/>
    <path d="M20,58 Q14,26 32,10 Q50,-1 58,20 Q64,40 46,63Z" fill="#E8B800" opacity="0.45"/>
    <path d="M6,53 Q0,26 14,12" stroke="#FFF8A0" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
    <ellipse cx="12" cy="1" rx="5" ry="4" fill="#8B6914" opacity="0.8" transform="rotate(-15,12,1)"/>
  </g>
  <text x="192" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Banana</text>

  <!-- ── ORANGE ── -->
  <g filter="url(#ds)">
    <ellipse cx="305" cy="138" rx="40" ry="38" fill="url(#og)"/>
    <ellipse cx="290" cy="118" rx="16" ry="12" fill="url(#osh)" opacity="0.7"/>
    <!-- peel texture dots -->
    <g fill="#C06000" opacity="0.25">
      <circle cx="295" cy="128" r="2"/><circle cx="308" cy="122" r="1.5"/><circle cx="320" cy="132" r="2"/>
      <circle cx="312" cy="145" r="1.5"/><circle cx="298" cy="148" r="2"/><circle cx="322" cy="150" r="1.5"/>
    </g>
    <path d="M305,101 Q310,91 315,86" stroke="#5C3000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M312,90 Q326,80 322,93 Q316,97 312,90Z" fill="#2D7A20"/>
  </g>
  <text x="305" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Orange</text>

  <!-- ── MILK CARTON ── -->
  <g filter="url(#ds)" transform="translate(390,70)">
    <rect x="0" y="35" width="56" height="76" fill="url(#mg)" rx="3"/>
    <polygon points="56,35 78,24 78,95 56,111" fill="url(#ms)"/>
    <polygon points="0,35 22,24 78,24 56,35" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="0,35 28,5 56,35" fill="#EAF4FF" opacity="0.92"/>
    <polygon points="56,35 78,24 50,-6 28,5" fill="#BCCEDE" opacity="0.88"/>
    <rect x="8" y="58" width="40" height="36" rx="4" fill="#3B8BD4" opacity="0.2"/>
    <rect x="12" y="64" width="30" height="5" rx="2" fill="#3B8BD4" opacity="0.45"/>
    <rect x="14" y="73" width="24" height="4" rx="2" fill="#3B8BD4" opacity="0.35"/>
    <rect x="16" y="81" width="18" height="3" rx="1" fill="#3B8BD4" opacity="0.28"/>
    <polygon points="3,37 22,26 22,68 3,79" fill="#FFFFFF" opacity="0.14"/>
  </g>
  <text x="432" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Milk</text>

  <!-- ── TOMATO CAN ── -->
  <g filter="url(#ds)" transform="translate(530,80)">
    <rect x="0" y="12" width="58" height="68" fill="url(#cg)"/>
    <rect x="50" y="12" width="10" height="68" fill="#7B1818" opacity="0.6"/>
    <ellipse cx="29" cy="12" rx="29" ry="10" fill="#FF6B6B"/>
    <ellipse cx="29" cy="12" rx="29" ry="10" fill="none" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="29" cy="80" rx="29" ry="10" fill="#9B2820"/>
    <rect x="0" y="28" width="58" height="36" fill="#FFFFFF" opacity="0.12"/>
    <rect x="4" y="35" width="44" height="5" rx="2" fill="#FFFFFF" opacity="0.38"/>
    <rect x="6" y="44" width="36" height="4" rx="2" fill="#FFFFFF" opacity="0.28"/>
    <rect x="8" y="52" width="28" height="3" rx="1" fill="#FFFFFF" opacity="0.22"/>
  </g>
  <text x="559" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Tomato Can</text>

  <!-- ── OIL BOTTLE ── -->
  <g filter="url(#ds)" transform="translate(648,52)">
    <rect x="10" y="44" width="38" height="86" rx="8" fill="#C8A800" opacity="0.28"/>
    <rect x="12" y="47" width="34" height="80" rx="6" fill="url(#olg)"/>
    <rect x="10" y="44" width="38" height="86" rx="8" fill="none" stroke="#A08010" stroke-width="1.5"/>
    <rect x="20" y="20" width="18" height="28" rx="4" fill="#C8A800" opacity="0.32"/>
    <rect x="22" y="22" width="14" height="24" rx="3" fill="url(#olg)" opacity="0.75"/>
    <rect x="20" y="20" width="18" height="28" rx="4" fill="none" stroke="#A08010" stroke-width="1.2"/>
    <rect x="17" y="9" width="24" height="14" rx="5" fill="#808030"/>
    <ellipse cx="29" cy="9" rx="12" ry="5" fill="#A0A040"/>
    <rect x="14" y="66" width="30" height="36" rx="4" fill="#FFFFFF" opacity="0.14"/>
    <rect x="16" y="73" width="24" height="4" rx="2" fill="#B8860B" opacity="0.55"/>
    <rect x="18" y="82" width="18" height="3" rx="1" fill="#B8860B" opacity="0.4"/>
    <rect x="12" y="48" width="10" height="38" rx="4" fill="#FFFFFF" opacity="0.18"/>
  </g>
  <text x="679" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Oil Bottle</text>

  <!-- ── WHEAT/ATTA BAG ── -->
  <g filter="url(#ds)" transform="translate(755,80)">
    <rect x="0" y="18" width="56" height="62" rx="7" fill="url(#wg)"/>
    <polygon points="56,18 76,9 76,70 56,80" fill="url(#ws)"/>
    <polygon points="0,18 20,9 76,9 56,18" fill="#F8F2DE" opacity="0.95"/>
    <ellipse cx="28" cy="50" rx="20" ry="18" fill="#FFFFFF" opacity="0.25"/>
    <g fill="#8A7A50" opacity="0.55">
      <ellipse cx="20" cy="46" rx="4" ry="2" transform="rotate(-25,20,46)"/>
      <ellipse cx="30" cy="42" rx="4" ry="2" transform="rotate(10,30,42)"/>
      <ellipse cx="38" cy="49" rx="4" ry="2" transform="rotate(-15,38,49)"/>
      <ellipse cx="24" cy="56" rx="4" ry="2" transform="rotate(35,24,56)"/>
      <ellipse cx="35" cy="56" rx="3.5" ry="2" transform="rotate(-5,35,56)"/>
    </g>
    <rect x="4" y="66" width="44" height="6" rx="3" fill="#A89A6A" opacity="0.45"/>
    <polygon points="3,20 20,12 20,46 3,54" fill="#FFFFFF" opacity="0.11"/>
  </g>
  <text x="800" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Wheat Bag</text>

  <!-- ── SPICE JAR ── -->
  <g filter="url(#ds)" transform="translate(862,88)">
    <rect x="4" y="22" width="44" height="48" rx="10" fill="url(#spg)"/>
    <rect x="6" y="24" width="40" height="44" rx="8" fill="#27AE60" opacity="0.65"/>
    <rect x="0" y="11" width="52" height="16" rx="6" fill="#145A32"/>
    <ellipse cx="26" cy="11" rx="26" ry="8" fill="#1A7040"/>
    <rect x="8" y="34" width="36" height="22" rx="4" fill="#FFEECC" opacity="0.22"/>
    <rect x="10" y="40" width="28" height="4" rx="2" fill="#FFEECC" opacity="0.5"/>
    <rect x="12" y="48" width="22" height="3" rx="1" fill="#FFEECC" opacity="0.38"/>
    <rect x="6" y="24" width="10" height="28" rx="4" fill="#FFFFFF" opacity="0.15"/>
  </g>
  <text x="888" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#C0A090" letter-spacing="0.5">Spice Jar</text>
</svg>
